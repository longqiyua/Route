[workspace]
resolver = "2"
members = [
    "crates/route-core",
    "crates/route-basic",
    "crates/route-sync",
    "crates/route-stats",
    "crates/route-plugins",
    "crates/route-cli",
    "crates/route-mcp",
    "crates/route-tui",
    "crates/route-http",
    "crates/route-engine",
    "crates/route-memory",
    "crates/route-pyo3",
]
exclude = [
    "crates/route-ppam",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "AGPL-3.0"
authors = ["Route Contributors"]
repository = "https://github.com/longqiyua/route"
description = "One Markdown, give it to your AI, and start using Route. 一个 Markdown，交给你的 AI，然后开始使用 Route。"

[workspace.dependencies]
# 错误处理
anyhow = "1.0"
thiserror = "1.0"

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 数据库
rusqlite = { version = "0.31", features = ["bundled"] }

# 加密哈希
sha2 = "0.10"
hex = "0.4"

# ID
ulid = { version = "1.1", features = ["serde"] }

# 时间
chrono = { version = "0.4", features = ["serde"] }

# 文件扫描（尊重 .gitignore）
ignore = "0.4"

# ZIP 归档
zip = "2.2"

# 文件监听
notify = "6.1"

# HTTP 客户端
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"] }

# HTTP 服务端（route-http）
axum = { version = "0.8", features = ["json", "macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
tower = "0.5"
base64 = "0.22"
percent-encoding = "2.3"
quick-xml = { version = "0.36", features = ["serialize"] }
hmac = "0.12"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# TUI (route-tui) — interactive REPL
rustyline = "14"
owo-colors = "4"
comfy-table = "7"

# Python bindings (route-pyo3)
pyo3 = { version = "0.23", features = ["abi3-py310", "extension-module", "serde"] }
once_cell = "1.20"

# 测试
rstest = "0.18"
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
