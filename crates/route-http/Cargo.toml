[package]
name = "route-http"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Route HTTP REST API server"
repository.workspace = true

[[bin]]
name = "route-http"
path = "src/main.rs"

[lib]
name = "route_http"
path = "src/lib.rs"

[dependencies]
route-core = { path = "../route-core", version = "1.0.0" }
route-basic = { path = "../route-basic", version = "1.0.0" }
route-sync = { path = "../route-sync", version = "1.0.0" }
route-stats = { path = "../route-stats", version = "1.0.0" }
route-plugins = { path = "../route-plugins", version = "1.0.0" }
route-cli = { path = "../route-cli", version = "1.0.0" }
route-memory = { path = "../route-memory", version = "1.0.0" }
anyhow.workspace = true
axum.workspace = true
tokio.workspace = true
tower-http.workspace = true
tower.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
clap = { workspace = true, features = ["derive"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "macros"] }