#应用名字
spring.application.name=DashBoard

# MySQL Localhost
# 备注MySQL名字时MySQL800，端口号3306，密码0126
spring.datasource.url=jdbc:mysql://localhost:3306/dashboard_db?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=0126
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MySQL Cloud 暂时没写

# JPA规范 1.保证数据库一致 2.保证语言一致 3.控制转换版本为MySQL8.0
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

#中文注释测试

spring.jackson.date-format=yyyy.MM.dd HH:mm
spring.jackson.time-zone=GMT+8
spring.jackson.locale=zh

