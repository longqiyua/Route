[package]
name = "route-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Route command-line interface"
repository.workspace = true

[lib]
name = "route_cli"
path = "src/lib.rs"

[[bin]]
name = "route"
path = "src/main.rs"

[dependencies]
route-core = { path = "../route-core", version = "1.0.0" }
route-basic = { path = "../route-basic", version = "1.0.0" }
route-sync = { path = "../route-sync", version = "1.0.0" }
route-stats = { path = "../route-stats", version = "1.0.0" }
route-plugins = { path = "../route-plugins", version = "1.0.0" }
route-engine = { path = "../route-engine", version = "1.0.0" }
route-memory = { path = "../route-memory", version = "1.0.0" }
route-tui = { path = "../route-tui", version = "1.0.0" }
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
ulid.workspace = true
reqwest = { workspace = true, features = ["json", "blocking"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true
anyhow.workspace = true

[features]
test-utils = ["route-basic/test-utils"]
