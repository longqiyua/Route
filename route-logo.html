<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>show_widget</title>
  <script>
    // -----------------------------------------------------------------
    // Trae IDE preview (trae-preview) auto-injects `@vite/client` into
    // every HTML file inside a Vite-detected workspace, then waits for
    // the script's WebSocket + ping handshake. For files that have
    // nothing to do with the running dev server (this logo swatch is
    // a self-contained one-pager), those injected calls fail with
    // `net::ERR_CONNECTION_REFUSED` / `ERR_ABORTED` / `ERR_SOCKET_NOT_CONNECTED`
    // and the diagnostics bridge surfaces them as four noisy errors.
    //
    // We can't tell the preview to stop injecting, but we *can* make
    // the injected client a no-op: every request to the Vite dev URL
    // is short-circuited to a fake success response before it leaves
    // the page, and the client script itself is removed from the DOM
    // as soon as it shows up. Net result: the page renders identically
    // to a plain browser, and the console is clean.
    // -----------------------------------------------------------------
    (function () {
      if (window.__routeLogoViteSilencerInstalled) return;
      window.__routeLogoViteSilencerInstalled = true;

      // 1. Short-circuit `fetch` calls that target the Vite dev server.
      //    The client does a `GET /__vite_ping` (and friends) to check
      //    connectivity; we answer 200 with an empty body so it never
      //    raises an error event.
      const realFetch = window.fetch ? window.fetch.bind(window) : null;
      const VITE_HOST_RE = /^(https?:)?\/\/(localhost|127\.0\.0\.1|\[::1\]):(1420|1421|1422|1423|1424|1425|1426|1427|1428|1429|1430)(\/|$)/i;
      window.fetch = function (input, init) {
        const url = typeof input === "string"
          ? input
          : input && input.url ? input.url : "";
        if (VITE_HOST_RE.test(url)) {
          return Promise.resolve(new Response("", { status: 200, statusText: "OK" }));
        }
        return realFetch ? realFetch(input, init) : Promise.reject(new Error("fetch unavailable"));
      };

      // 2. Same treatment for `XMLHttpRequest`, which older Vite
      //    fallbacks use. We just return a fake "done" xhr.
      const RealXHR = window.XMLHttpRequest;
      if (RealXHR) {
        const FakeXHR = function () {
          this.readyState = 4;
          this.status = 200;
          this.statusText = "OK";
          this.responseText = "";
          this.response = "";
          this._listeners = {};
        };
        FakeXHR.prototype.open = function () {};
        FakeXHR.prototype.setRequestHeader = function () {};
        FakeXHR.prototype.send = function () {
          const self = this;
          setTimeout(function () {
            if (typeof self.onload === "function") self.onload();
            if (typeof self.onreadystatechange === "function") self.onreadystatechange();
          }, 0);
        };
        FakeXHR.prototype.addEventListener = function (type, cb) {
          this._listeners[type] = cb;
        };
        FakeXHR.prototype.removeEventListener = function () {};
        FakeXHR.prototype.getAllResponseHeaders = function () { return ""; };
        FakeXHR.prototype.getResponseHeader = function () { return null; };
        FakeXHR.prototype.abort = function () {};
        // Only swap the constructor for the vite path; the rest of the
        // page (if it ever uses XHR) still goes through the real one.
        // We achieve that by overriding `XMLHttpRequest` only when the
        // call originates from a vite-injected script — but since we
        // can't easily attribute the caller, the simpler approach is
        // to fully replace XHR; this page doesn't use it.
        window.XMLHttpRequest = FakeXHR;
      }

      // 3. WebSocket: the HMR client opens `ws://localhost:1420/`.
      //    Replace the constructor with a no-op stub so the connection
      //    is never attempted and the page never sees a `close` event.
      //    The constructor must carry the same static constants the
      //    WebIDL spec defines on the interface — the HMR client
      //    compares `WebSocket.OPEN` to `ws.readyState` in places, and
      //    without the constants it throws "Cannot read properties of
      //    undefined" the first time the equality check runs.
      if (window.WebSocket) {
        function FakeWebSocket(url) {
          this.url = url;
          // CONNECTING (0) is the spec-defined initial state. We jump
          // straight to CLOSED below so the HMR client never sees a
          // "still connecting" socket, but keeping the property name
          // here makes the stub readable.
          this.readyState = 0;
          // Defer the state transition by one microtask so any code
          // that reads `readyState` right after `new WebSocket(...)`
          // still sees the spec-defined CONNECTING value.
          const self = this;
          Promise.resolve().then(() => {
            self.readyState = FakeWebSocket.CLOSED;
          });
        }
        FakeWebSocket.prototype.send = function () {};
        FakeWebSocket.prototype.close = function () {};
        FakeWebSocket.prototype.addEventListener = function () {};
        FakeWebSocket.prototype.removeEventListener = function () {};
        // The WebSocket spec exposes these as own properties of the
        // constructor (not on the prototype) — `WebSocket.OPEN`,
        // `new WebSocket(...).readyState === WebSocket.OPEN`, etc.
        // Missing them was the source of the noisy
        // "Cannot read properties of undefined" error before.
        FakeWebSocket.CONNECTING = 0;
        FakeWebSocket.OPEN = 1;
        FakeWebSocket.CLOSING = 2;
        FakeWebSocket.CLOSED = 3;
        // `dispatchEvent` is required by the EventTarget interface.
        // Returning `true` ("not cancelled") keeps any listeners that
        // happen to be installed happy.
        FakeWebSocket.prototype.dispatchEvent = function () { return true; };
        window.WebSocket = FakeWebSocket;
      }

      // 4. As a belt-and-braces measure, also strip the injected
      //    `<script src="…/@vite/client">` tag the moment the preview
      //    appends it. Even if the above three patches miss some
      //    path, removing the script means its `ping` loop never
      //    runs in the first place.
      //
      //    The observer must be installed *immediately*, not deferred
      //    to DOMContentLoaded. The IDE preview can inject the
      //    @vite/client tag before our `DOMContentLoaded` listener
      //    would fire, and any scripts the preview appends in that
      //    window would otherwise execute unblocked.
      //
      //    We use `querySelectorAll` (not `querySelector`) because a
      //    single MutationObserver notification can carry a batch of
      //    mutations. The callback fires once per batch, so removing
      //    just the first match would leave any second/third
      //    injection behind to run its `ping` loop.
      const dropViteClient = function () {
        const scripts = document.querySelectorAll('script[src*="@vite/client"]');
        for (let i = 0; i < scripts.length; i++) {
          const s = scripts[i];
          if (s && s.parentNode) s.parentNode.removeChild(s);
        }
      };
      const mo = new MutationObserver(dropViteClient);
      dropViteClient();
      // Some hosts (older WebViews, sandboxed iframes) reject
      // `documentElement` as the observation root; `document` is
      // universally available and covers the same node set.
      mo.observe(document, { childList: true, subtree: true });
    })();
  </script>
</head>
<body>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}
.scene {
  padding: 56px 64px;
  display: flex;
  flex-direction: column;
  gap: 0;
  background: transparent;
}
.row {
  display: flex;
  align-items: center;
  gap: 32px;
  padding: 32px 0;
  border-bottom: .5px solid rgba(128,128,128,.1);
}
.row:last-child { border-bottom: none; }
.label {
  font-family: ui-sans-serif, system-ui, sans-serif;
  font-size: 10px;
  color: rgba(140,140,140,.45);
  width: 44px;
  letter-spacing: .06em;
}
.swatch {
  display: inline-flex;
  align-items: center;
  padding: 20px 28px;
  border-radius: 3px;
}
.swatch.dark  { background: #0A0A0B; }
.swatch.light { background: #F8F8F8; border: .5px solid rgba(0,0,0,.07); }
.route-logo {
  display: inline-flex;
  align-items: center;
  user-select: none;
}
.route-logo .wordmark {
  font-family: 'Poppins', -apple-system, system-ui, sans-serif;
  font-weight: 600;
  font-size: 21px;
  line-height: 1;
  letter-spacing: -0.015em;
}
</style>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap" rel="stylesheet">

<div class="scene">
  <div class="row">
    <span class="label">Dark</span>
    <div class="swatch dark">
      <div class="route-logo" id="r-dark"></div>
    </div>
  </div>
  <div class="row">
    <span class="label">Light</span>
    <div class="swatch light">
      <div class="route-logo" id="r-light"></div>
    </div>
  </div>
</div>

<script>
function reuleauxPath(cx, cy, R) {
  // 等边三角形三顶点，顶点朝上（270°, 30°, 150°）
  const angles = [270, 30, 150].map(d => d * Math.PI / 180);
  const pts = angles.map(a => ({
    x: cx + R * Math.cos(a),
    y: cy + R * Math.sin(a)
  }));
  // 边长
  const side = R * Math.sqrt(3);
  // 每段弧：以对面顶点为圆心，半径=边长，顺时针
  return (
    `M ${pts[0].x} ${pts[0].y} ` +
    `A ${side} ${side} 0 0 1 ${pts[1].x} ${pts[1].y} ` +
    `A ${side} ${side} 0 0 1 ${pts[2].x} ${pts[2].y} ` +
    `A ${side} ${side} 0 0 1 ${pts[0].x} ${pts[0].y} Z`
  );
}

function circlePath(cx, cy, r) {
  // 用两段半圆弧构成完整圆路径（evenodd 挖孔用）
  return (
    `M ${cx + r} ${cy} ` +
    `A ${r} ${r} 0 1 0 ${cx - r} ${cy} ` +
    `A ${r} ${r} 0 1 0 ${cx + r} ${cy} Z`
  );
}

function buildLogo(id, iconColor, textColor) {
  const el = document.getElementById(id);
  if (!el) return;

  // 图标尺寸：放大到 18px，视觉上和 21px 字高更匹配
  const S   = 18;
  const cx  = S / 2;
  // 重心修正：勒洛三角形顶点朝上时视觉重心偏上，cy 微调下移
  const cy  = S / 2 + 0.4;
  const R   = S * 0.44;   // 外接圆半径，留边距

  // 圆孔：占外接圆半径的 30%，够看清但不抢形
  const holeR = R * 0.30;

  const outer = reuleauxPath(cx, cy, R);
  const hole  = circlePath(cx, cy, holeR);

  const ns  = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('width',  S);
  svg.setAttribute('height', S);
  svg.setAttribute('viewBox', `0 0 ${S} ${S}`);
  svg.style.cssText = 'display:block;flex-shrink:0;transform:translateY(0.5px);overflow:visible;';

  const path = document.createElementNS(ns, 'path');
  path.setAttribute('d', outer + ' ' + hole);
  path.setAttribute('fill', iconColor);
  path.setAttribute('fill-rule', 'evenodd');
  svg.appendChild(path);

  // 图标容器
  const symbol = document.createElement('span');
  symbol.style.cssText = `display:flex;align-items:center;width:${S}px;height:${S}px;flex-shrink:0;`;
  symbol.appendChild(svg);

  // wordmark
  const span = document.createElement('span');
  span.className = 'wordmark';
  span.textContent = 'route';
  span.style.color = textColor;
  span.style.marginLeft = '9px';

  el.appendChild(symbol);
  el.appendChild(span);
}

buildLogo('r-dark',  '#B4AEEA', '#F5EFE6');
buildLogo('r-light', '#B4AEEA', '#0A0A0B');
</script>
<script data-tabbit-widget-diagnostics="true">
(function(){
  if (window.__tabbitWidgetDiagnosticsInstalled) return;
  window.__tabbitWidgetDiagnosticsInstalled = true;
  window.__TABBIT_WIDGET_ERRORS__ = window.__TABBIT_WIDGET_ERRORS__ || [];
  function emit(level, args) {
    var payload = {
      type: "tabbit_widget_diagnostics",
      level: level,
      message: Array.prototype.slice.call(args || []).map(function(item) {
        if (item && item.stack) return item.stack;
        if (typeof item === "string") return item;
        try { return JSON.stringify(item); } catch (_) { return String(item); }
      }).join(" "),
      timestamp: Date.now()
    };
    window.__TABBIT_WIDGET_ERRORS__.push(payload);
    try { window.parent && window.parent.postMessage(payload, "*"); } catch (_) {}
  }
  var originalError = console.error;
  console.error = function() {
    emit("error", arguments);
    return originalError && originalError.apply(console, arguments);
  };
  window.addEventListener("error", function(event) {
    emit("error", [event.message || "Script error", event.filename || "", event.lineno || ""]);
  });
  window.addEventListener("unhandledrejection", function(event) {
    emit("unhandledrejection", [event.reason || "Unhandled promise rejection"]);
  });
})();
</script>
</body>
</html>
