[package]
name = "route-desktop"
version = "0.1.0"
description = "Route desktop app"
authors = ["Route Contributors"]
edition = "2021"

# This is an independently-built Tauri app (own dependency tree, own
# tauri.conf.json) living under the repo root. Without this empty
# `[workspace]` table Cargo would walk up, find the root Rust workspace
# (whose members are only `crates/*`), and refuse to build with
# "current package believes it's in a workspace when it's not".
# Declaring it as its own workspace makes `cargo check/build` work from
# this directory and keeps it out of the root workspace's shared target/.
[workspace]

[lib]
name = "route_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
