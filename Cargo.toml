[workspace]
resolver = "2"
members = [
    "crates/route-core",
    "crates/route-basic",
    "crates/route-sync",
    "crates/route-stats",
    "crates/route-plugins",
    "crates/route-agent",
    "crates/route-bench",
    "crates/route-cli",
    "crates/route-mcp",
    "crates/route-tauri",
    "crates/route-tui",
    "crates/route-memory",
    "crates/route-engine",
    "crates/route-skill",
    "crates/route-vm",
    "crates/route-vibe",
    "crates/route-test",
    "crates/route-base",
    "crates/route-pyo3",
]

[workspace.package]
version = "0.4.0-beta"
edition = "2021"
license = "AGPL-3.0"
authors = ["Route Contributors"]
repository = "https://github.com/longqiyua/route"

[workspace.dependencies]
# 错误处理
anyhow = "1.0"
thiserror = "1.0"

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 数据库
rusqlite = { version = "0.31", features = ["bundled"] }

# 加密哈希
sha2 = "0.10"
hex = "0.4"

# ID
ulid = { version = "1.1", features = ["serde"] }

# 时间
chrono = { version = "0.4", features = ["serde"] }

# 文件扫描（尊重 .gitignore）
ignore = "0.4"

# ZIP 归档
zip = "2.2"

# 文件监听
notify = "6.1"

# HTTP（Phase 4 启用）
reqwest = { version = "0.12", features = ["json", "rustls-tls", "blocking"] }
base64 = "0.22"
percent-encoding = "2.3"
quick-xml = { version = "0.36", features = ["serialize"] }
hmac = "0.12"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# TUI (route-tui) — interactive REPL
rustyline = "14"
owo-colors = "4"
comfy-table = "7"

# 测试
rstest = "0.18"
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
