[package]
name = "route-ppam"
version = "0.5.0"
edition = "2021"
license = "AGPL-3.0"
description = "Route PPAM Bridge — pluggable document enhancement embedding for PPAM"
repository = "https://github.com/longqiyua/route"

[lib]
name = "route_ppam"
path = "src/lib.rs"

[dependencies]
route-basic = { path = "../route-basic" }
route-memory = { path = "../route-memory" }
route-core = { path = "../route-core" }
route-engine = { path = "../route-engine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
anyhow = "1"
tempfile = "3"