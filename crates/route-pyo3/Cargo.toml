[package]
name = "route-pyo3"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Python bindings for Route — PyO3 native module"

[lib]
name = "route"
crate-type = ["cdylib"]

[dependencies]
route-base = { path = "../route-base", version = "0.4.0-beta" }
route-engine = { path = "../route-engine", version = "0.4.0-beta" }
route-memory = { path = "../route-memory", version = "0.4.0-beta" }
anyhow.workspace = true
serde_json.workspace = true

[target.'cfg(all(target_os = "windows", target_env = "msvc"))'.dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }

[target.'cfg(not(all(target_os = "windows", target_env = "msvc")))'.dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }